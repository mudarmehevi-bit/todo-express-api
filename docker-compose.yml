services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/data/todos.db
      - FRONTEND_URL=http://localhost
    volumes:
      - sqlite_data:/app/data
    networks:
      - todo-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - todo-network

volumes:
  sqlite_data:

networks:
  todo-network:
    driver: bridge
